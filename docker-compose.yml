services:
  db:
    image: postgres:16-alpine
    container_name: jeb-postgres
    environment:
      POSTGRES_DB: jeb
      POSTGRES_USER: jeb
      POSTGRES_PASSWORD: jeb
    ports:
      # Host 5433 → contenedor 5432 (evita choque si ya tienes Postgres local en 5432)
      - "5433:5432"
    volumes:
      - jeb_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeb -d jeb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  jeb_pgdata:
